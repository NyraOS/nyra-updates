# Deploys the registry Worker from main, only when the owner turns it on with the repository
# variable REGISTRY_DEPLOY=on (registry/README.md). The route in wrangler.toml is a separate change.
# The tests run first; there is no pull_request trigger, so nothing else can deploy.
name: registry-deploy
on:
  push:
    branches: [main]
    paths: ["registry/**"]
concurrency:
  group: registry-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.REGISTRY_DEPLOY == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
