# Secret scanning on every push and pull request: no key or token may ever land in this repository.
# Runs the gitleaks container directly: the gitleaks GitHub Action needs a license for organizations.
# Every push to any branch is scanned (a branch without a pull request too). The pull_request run
# only scans pull requests from forks, whose pushes do not run here, so each push is scanned once.
name: secrets
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    # The pull_request run skips this job; a skipped check counts as passed, so it gets its own name.
    name: ${{ github.event_name == 'pull_request' && 'gitleaks (pull request)' || 'gitleaks' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks v8.30.1, pinned by its multi-arch index digest (Dependabot does not update images in run: lines).
      # From GitHub's registry, the project's own (the same index digest as ghcr.io/gitleaks/gitleaks:v8.30.1
      # and docker.io/zricethezav/gitleaks:v8.30.1): Docker Hub limits unauthenticated pulls per runner IP.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner -v /repo
