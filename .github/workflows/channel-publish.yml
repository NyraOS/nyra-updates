# Signs the channel sheets from the state in git and writes them to KV (registry/README.md,
# "Signing in CI"). Only on main: push (a rollout change is a commit) and a daily run, so the
# sheets never expire. No workflow_dispatch and no pull_request: nothing but main is signed.
# This job has no Node, npm or wrangler: KV goes through curl (publish-sheet.sh).
# Off until the owner sets the repository variable SHEET_KMS_KEY (after main is protected).
name: channel-publish
on:
  push:
    branches: [main]
    paths: ["channels/**", "keys/**"]
  schedule:
    - cron: "23 4 * * *"
concurrency:
  group: channel-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.SHEET_KMS_KEY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: ${{ vars.SHEET_WIF_PROVIDER }}
          service_account: ${{ vars.SHEET_SIGNER_SA }}
          token_format: access_token
          create_credentials_file: false
      # dev has no file: it is the newest version in releases.json (publish-sheet.sh), signed as
      # soon as the repository has a release. A beta or stable channel without a file has no
      # release yet: there is nothing to sign, so it is skipped.
      - name: Publish the sheets
        env:
          SHEET_KMS_KEY: ${{ vars.SHEET_KMS_KEY }}
          SHEET_KMS_TOKEN: ${{ steps.google.outputs.access_token }}
          SHEET_PUBLIC_KEY: ${{ github.workspace }}/keys/channel-sheet.pem
          CLOUDFLARE_KV_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
        run: |
          for dir in channels/*/; do
            repo=$(basename "$dir")
            if [ "$(jq length "${dir}releases.json")" -gt 0 ]; then
              registry/scripts/publish-sheet.sh --remote "$repo:dev"
            fi
            for channel in beta stable; do
              [ -f "$dir$channel.json" ] || continue
              registry/scripts/publish-sheet.sh --remote "$repo:$channel"
            done
          done
